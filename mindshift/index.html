<h1>MindShift</h1>
<p class="tagline">一款专注、纯粹的 macOS 思维导图工具。</p>
<p>用键盘就能把想法一气呵成地记下来：Tab 建子节点，Enter 建同级节点，空格开始输入。支持思维导图与逻辑结构图两种样式、分支拖拽重组、框选批量整理、节点折叠。</p>
<p>当前版本完全免费，全部功能均可使用，不限制导图数量。导图只保存在你自己的 Mac 上，应用不联网，也没有账户。</p>
