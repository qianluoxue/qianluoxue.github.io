<h1>隐私政策</h1>
<p>MindShift 不收集你的任何个人信息。你的导图只存在你自己的 Mac 上，应用不联网，也没有账户系统。</p>
<p>我们不收集、不上传、不出售你的姓名、邮箱、位置、设备标识或任何可识别你身份的信息。应用内没有任何第三方分析、广告或追踪组件。</p>
<p>你创建的导图全部保存在本机应用沙盒内。当前版本没有任何联网能力，内容不会离开这台 Mac。</p>
<p>卸载应用即删除全部数据。对隐私有任何疑问，请联系 iosdevbox@proton.me</p>
